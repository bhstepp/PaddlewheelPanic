<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Paddlewheel Panic</title>
  <meta name="description" content="A 1928 river chase. Jump the barrels, whistle at the critters, and reach the landing before the Captain catches up.">
  <meta name="theme-color" content="#171614">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Paddlewheel">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="game" aria-label="Paddlewheel Panic game"></canvas>
  <div id="safe-probe" aria-hidden="true"></div>
  <div id="rotate" hidden>
    <div class="card">
      <svg class="phone" viewBox="0 0 120 120" aria-hidden="true">
        <g class="spin">
          <rect x="38" y="16" width="44" height="88" rx="9" fill="none" stroke="#f8f6f0" stroke-width="5"/>
          <circle cx="60" cy="94" r="4" fill="#f8f6f0"/>
          <rect x="52" y="22" width="16" height="4" rx="2" fill="#f8f6f0"/>
        </g>
        <path d="M18 70 A44 44 0 0 1 40 22" fill="none" stroke="#9a968f" stroke-width="4" stroke-linecap="round"/>
        <path d="M34 16 L42 22 L34 29" fill="none" stroke="#9a968f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p>Turn your phone sideways</p>
    </div>
  </div>
  <noscript><p class="noscript">Paddlewheel Panic needs JavaScript.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
